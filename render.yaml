# Blueprint de Render para el backend de Ivy (deployment-readme).
# Render > New > Blueprint > este repositorio. Las claves se piden al crear el servicio (sync: false)
# y nunca se guardan en el repositorio.
services:
  - type: web
    name: lumi-backend
    runtime: docker
    region: virginia          # cerca de Groq y Deepgram (EE. UU.)
    plan: starter             # siempre encendido: sin arranque en frío (el plan free se duerme)
    branch: dev
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit   # despliega en cada push a la rama
    envVars:
      - key: VOICE_ENABLED
        value: "true"
      - key: VOICE_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      # SODA_APP_TOKEN es opcional (sin él se sirve el snapshot incluido en la imagen): si se quiere el
      # refresco desde la API, se añade luego en el panel del servicio. No va aquí porque Render exige un
      # valor para toda variable con sync: false.
      - key: CORS_ORIGINS         # p. ej. https://lumi.vercel.app,https://lumi-*-<equipo>.vercel.app
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_FALLBACK_MODEL    # respaldos en orden cuando el principal agota su cuota por minuto
        value: openai/gpt-oss-20b
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-celeste-es
      - key: ENDPOINTING_MS
        value: "400"
