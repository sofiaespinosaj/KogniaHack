[pytest]
# Suite de QA del proyecto. Se ejecuta con el entorno del backend:
#   uv run --project backend pytest quality
testpaths = tests
addopts = -ra
markers =
    integridad: integridad del snapshot (data/snapshot.parquet)
    cifras: cifras de oro contra SQL independiente y contra las tools
    busqueda: búsqueda por nombre, tildes, mayúsculas y ambigüedad
    estados: estados del contrato de resultado (no_encontrado, ambiguo, sin_cobertura...)
    seguridad: validación de argumentos, inyección y presupuesto de llamadas
    latencia: tiempos de las tools frente a la meta de 200 ms (p95)
    contrato: eventos del MockTransport validados contra el JSON Schema publicado
